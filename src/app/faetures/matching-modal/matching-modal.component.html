<h2 mat-dialog-title>Matching - {{data.title}}</h2>

<mat-dialog-content>
     <div class="card tbl-card">
      <div class="table-responsive">
        <table mat-table [dataSource]="matchings" class="mat-elevation-z8">

  

  <!-- Position Column -->
  <ng-container matColumnDef="consultant">
    <th mat-header-cell *matHeaderCellDef> Consultant </th>

    <td mat-cell *matCellDef="let element"> {{element.consultantName}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef> Match Score </th>
    <td mat-cell *matCellDef="let element"> <div class="score-container">
        <mat-progress-bar mode="determinate" [value]="element.matchScore">

        </mat-progress-bar>
        <span>
            {{element.matchScore}}%
        </span>
    </div></td>
  </ng-container>

  <ng-container matColumnDef="matchedSkills">
    <th mat-header-cell *matHeaderCellDef>Matched Skills</th>
    <td mat-cell *matCellDef="let element">
        <mat-chip-set>
            <mat-chip color="primary" selected *ngFor="let skill of element.matchedSkills">
                {{skill}}
            </mat-chip>
        </mat-chip-set>
    </td>

  </ng-container>

  <ng-container matColumnDef="missingSkills">
    <th mat-header-cell *matHeaderCellDef>Missing Skills</th>
    <td mat-cell *matCellDef="let element">
        <mat-chip-set>
            <mat-chip color="primary" selected *ngFor="let skill of element.missingSkills">
                {{skill}}
            </mat-chip>
        </mat-chip-set>
    </td>

  </ng-container>






 

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
 
      </div>
    </div>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="close()">Fermer</button>
   
</mat-dialog-actions>

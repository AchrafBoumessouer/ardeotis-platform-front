<div class="row">


  <div class="col-md-12 col-xl-8">
    <div class="table-header">
      <h5 class="mb-3">Missions</h5>
    <button mat-raised-button color="primary" style="margin-left: auto" (click)="openAddModal()">ajouter mission</button>
    </div>
    
    <div class="card tbl-card">
      <div class="table-responsive">
        <table mat-table [dataSource]="missions" class="mat-elevation-z8">

  

  <!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> No. </th>

    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let element"> {{element.title}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="client">
    <th mat-header-cell *matHeaderCellDef> Client </th>
    <td mat-cell *matCellDef="let element"> {{element.client}} </td>
  </ng-container>



  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> STATUS </th>
    <td mat-cell *matCellDef="let element"> {{element.status}} </td>
  </ng-container>

  <ng-container matColumnDef="startDate">
    <th mat-header-cell *matHeaderCellDef> start date </th>
    <td mat-cell *matCellDef="let element"> {{element.startDate}} </td>
  </ng-container>
  <ng-container matColumnDef="endDate">
    <th mat-header-cell *matHeaderCellDef> end date </th>
    <td mat-cell *matCellDef="let element"> {{element.endDate}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef>Actions </th>
  <td mat-cell *matCellDef="let row">
    <div class="actions">
      <button mat-icon-button  class="iconbutton" color="primary" (click)="openViewModal(row)">
        <mat-icon >visibility</mat-icon>
      </button>
    <button mat-icon-button  class="iconbutton" color="primary" (click)="openEditModal(row)">
        <mat-icon >edit</mat-icon>
      </button>
    <button mat-icon-button class="iconbutton" color="warn" (click)="openDeleteModal(row)">
        <mat-icon aria-label="Delete">delete</mat-icon>
      </button>
      <button mat-icon-button class="iconbutton" color="accent" (click)="openMatchingModal(row)">
        <mat-icon aria-label="groups">groups</mat-icon>
      </button>
    </div>
    </td>
</ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
 <mat-paginator
  [length]="totalElements"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  [pageSizeOptions]="[1,10,20]"
  showFirstLastButtons
  (page)="onPageChange($event)"></mat-paginator>
      </div>
    </div>
  </div>

  <!-- [ sample-page ] end -->
</div>

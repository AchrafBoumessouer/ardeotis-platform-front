<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="consultant-form">
        <mat-form-field appearence="outline" class="w-100">
         <mat-label>Prenom</mat-label>
         <input matInput formControlName="firstName">
        </mat-form-field>

        <mat-form-field appearence="outline" class="w-100">
         <mat-label>Nom</mat-label>
         <input matInput formControlName="lastName">
        </mat-form-field>

        <mat-form-field appearence="outline" class="w-100">
         <mat-label>Email</mat-label>
         <input matInput formControlName="email">
        </mat-form-field>


        <mat-form-field appearence="outline" class="w-100">
         <mat-label>Status </mat-label>
          <mat-select formControlName="status">
            <mat-option value="AVAILABLE">AVAILABLE</mat-option>
            <mat-option value="ON_MISSION">IN_MISSION</mat-option>
            <mat-option value="UNAVAILABLE">UNAVAILABLE</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-checkbox formControlName="available">Disponible</mat-checkbox>

    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="close()" >Fermer</button>
    @if(mode !== 'VIEW'){<button mat-raised-button color="primary" (click)="save()">Enregistrer</button>}
</mat-dialog-actions>

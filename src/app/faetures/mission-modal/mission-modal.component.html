<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content>
    <form [formGroup]="form" class="consultant-form">
        <mat-form-field appearence="outline" class="w-100">
            <mat-label>Client</mat-label>
            <input matInput formControlName="client">
        </mat-form-field>

        <mat-form-field appearence="outline" class="w-100">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title">
        </mat-form-field>

        <mat-form-field appearence="outline" class="w-100">
            <mat-label>Status </mat-label>
            <input matInput formControlName="status">
        </mat-form-field>

        <mat-form-field appearence="outline" class="w-100">
            <mat-label>Skills </mat-label>
            <input matInput #skillInput formControlName="skills" (keydown.enter)="addSkill(skillInput.value); skillInput.value=''; $event.preventDefault()">
       
        </mat-form-field>
        <div class="skills-list">
            <mat-chip-set>
                <mat-chip
                *ngFor="let skill of skills"
                removable="true"
                (removed)="removeSkill(skill)">
                 {{skill}}
                 <button matChipRemove>
                    X
                 </button>
                </mat-chip>
            </mat-chip-set>

        </div>

        <mat-form-field appearence="outline" class="w-100">
            <mat-label>satrt date  </mat-label>
            <input matInput formControlName="startDate" [matDatepicker]="releasedAtPicker">
                 <mat-datepicker-toggle matIconSuffix [for]="releasedAtPicker">
            </mat-datepicker-toggle ><mat-datepicker #releasedAtPicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearence="outline" class="w-100">
            <mat-label>end date </mat-label>
            <input matInput formControlName="endDate" [matDatepicker]="releasedAtPicker1">
            <mat-datepicker-toggle matIconSuffix [for]="releasedAtPicker1">
            </mat-datepicker-toggle ><mat-datepicker #releasedAtPicker1></mat-datepicker>
        </mat-form-field>

    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="close()">Fermer</button>
    @if(mode !== 'VIEW'){<button mat-raised-button color="primary" (click)="save()">Enregistrer</button>}
</mat-dialog-actions>
